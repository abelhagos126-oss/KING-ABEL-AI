
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="THE KING ABEL AI - Personal AI Assistant">
    <title>THE KING ABEL AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">

        <header class="header">
            <div class="logo">👑</div>
            <div class="header-text">
                <h1>THE KING ABEL AI</h1>
                <p>Your personal AI assistant</p>
            </div>
            <div class="status">
                <span class="status-dot"></span>
                Online
            </div>
        </header>

        <main class="chat-container">
            <div id="chat-messages" class="chat-messages">
                <div class="message assistant-message">
                    <div class="message-avatar">👑</div>
                    <div class="message-content">
                        There was one king, and his name is Abel.
                        <br><br>
                        Welcome! How can I help you today?
                    </div>
                </div>
            </div>

            <form id="chat-form" class="chat-form">
                <input
                    type="text"
                    id="message-input"
                    placeholder="Message THE KING ABEL AI..."
                    autocomplete="off"
                    required
                >
                <button type="submit" id="send-button">
                    Send
                </button>
            </form>
        </main>

        <footer class="footer">
            <p>THE KING ABEL AI &copy; 2026</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
